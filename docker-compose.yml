version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: axon_postgres
    environment:
      POSTGRES_USER: axon_user
      POSTGRES_PASSWORD: axon_password
      POSTGRES_DB: axon_db
    ports:
      - "5432:5432"
    volumes:
      - axon_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: axon_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  axon_pgdata:
